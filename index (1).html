<head>

<title>Троллейбусный парк</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: шапка с балансом и датой, карта-схема на весь экран, нижняя навигация. Палитра: озёрный бирюзовый акцент на нейтралях с зелёным оттенком. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface2:#e3eae8; --fg:#14211e; --muted:#586965; --line:#cbd6d3;
  --accent:#0e7a6b; --accent-fg:#ffffff; --good:#2a8f4f; --warn:#b86e00; --bad:#c93a3a; --map:#e8eeec; --grid:#d5dedb; --water:#c7dde5; --road:#ffffff;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#172120; --surface2:#1f2d2b; --fg:#e6efed; --muted:#93a6a1; --line:#2a3a37;
    --accent:#4fc3b0; --accent-fg:#06201b; --good:#5ccf86; --warn:#e6a93c; --bad:#ef6b6b; --map:#0c1211; --grid:#1a2624; --water:#14262c; --road:#2b3935; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --surface2:#1f2d2b; --fg:#e6efed; --muted:#93a6a1; --line:#2a3a37;
  --accent:#4fc3b0; --accent-fg:#06201b; --good:#5ccf86; --warn:#e6a93c; --bad:#ef6b6b; --map:#0c1211; --grid:#1a2624; --water:#14262c; --road:#2b3935; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.4;overflow:hidden}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column}
header{background:var(--accent);color:var(--accent-fg);padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.h-left{min-width:0}
.h-title{font-family:var(--font-head);font-weight:700;font-size:17px;letter-spacing:.01em}
.h-sub{font-size:12px;opacity:.9}
.h-right{text-align:right;flex:none}
.h-money{font-family:var(--font-head);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.lvl{display:flex;align-items:center;gap:8px;font-size:12px;justify-content:flex-end}
.lvl i{display:block;width:84px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--accent-fg) 30%,transparent);overflow:hidden}
.lvl b{display:block;height:100%;background:var(--accent-fg);width:0}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding-block:14px}
#v-map{padding:0;overflow:hidden;background:var(--map)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.chip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.zoom button{width:38px;height:38px;border:0;background:var(--surface);font-size:20px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap}
.lg{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px 3px 6px;font-size:12px;display:flex;gap:6px;align-items:center;font-weight:600}
.lg.dim{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5}
.toast.on{opacity:1}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font-size:12px;font-weight:600;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
nav button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
nav .n{display:block;font-family:var(--font-head);font-size:15px;margin-bottom:1px}
h2{font-family:var(--font-head);font-size:18px;margin:0 0 10px}
.sec{max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.num{font-family:var(--font-head);font-weight:700;font-size:17px}
.mut{color:var(--muted);font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;background:var(--surface2)}
.pill.line{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:8px 0 2px}
.bar b{display:block;height:100%;border-radius:3px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-weight:600;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:100%;font-size:13px}
.badge{display:inline-flex;min-width:26px;height:22px;padding:0 6px;border-radius:5px;color:#fff;font-family:var(--font-head);font-weight:700;font-size:13px;align-items:center;justify-content:center}
.spec{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.spec b{color:var(--fg);font-weight:600}
.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log time{color:var(--muted);font-size:11px;display:block}
.offer{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.stars{font-family:var(--font-head);font-weight:700;letter-spacing:.05em}
.stars.hi{color:var(--good)}.stars.mid{color:var(--warn)}.stars.lo{color:var(--bad)}
.rev{padding:10px 0;border-bottom:1px solid var(--line)}
.rev p{margin:4px 0 0}
.reply{margin:8px 0 0;padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:13px}
.reply b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.sum{display:flex;gap:14px;align-items:baseline;margin-bottom:10px}
.sum .big{font-family:var(--font-head);font-weight:700;font-size:30px}
.note{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.vh{display:flex;align-items:center;gap:10px}.ico{display:block;flex:none}
</style>
</head>

/* ---------- геометрия: lon/lat -> км ---------- */
const lat0 = 61.78, lon0 = 34.3;
const KX = 111.32*Math.cos(lat0*Math.PI/180), KY = 111.2;
const toKm = ([lo,la]) => [(lo-lon0)*KX,(lat0-la)*KY];
for (const r of ROUTES){
  r.xy = r.pts.map(toKm);
  r.cum=[0];
  for(let i=1;i<r.xy.length;i++){const a=r.xy[i-1],b=r.xy[i];r.cum.push(r.cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));}
  r.len=r.cum[r.cum.length-1];
  r.color=COLORS[r.ref]||'#888';
}
const BB = (()=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const r of ROUTES)for(const [x,y] of r.xy){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}return{x0,y0,x1,y1};})();
function posAt(r,d){
  d=Math.max(0,Math.min(r.len,d));
  let lo=0,hi=r.cum.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(r.cum[m]<=d)lo=m;else hi=m;}
  const seg=r.cum[hi]-r.cum[lo]||1,t=(d-r.cum[lo])/seg,a=r.xy[lo],b=r.xy[hi];
  return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
}

  if(rating<=2)S.dayBad=(S.dayBad|0)+1;
  S.reviews.unshift({id:S.nextRid++,t:dateStr()+' '+clockStr(),ref,num,rating,adj:0,cat,did:did||0,text:pick(TXT[cat]||TXT.ok),who:pick(NAMES),reply:''});
  if(S.reviews.length>80)S.reviews.pop();
}
const eff=r=>Math.min(5,r.rating+(r.adj||0));
function maybeReview(v,r){
  if(Math.random()>0.3)return;
  const rs=RS(r.ref);
  let q=4.2+((({ziu:-.5,ptz:-.5,vztm:-.2,btz:-.1,mtrz:-.1,v375:-.1,bkm:0,v463:.1,optima:.3,v522:.3,v529:.4,avg:.6})[v.model])||0);
  let cat='ok';
  if(v.wear>=KVR_WEAR){q-=1.2;cat='wear';}else if(v.wear>=18){q-=.5;cat='wear';}
  if(v.sinceTO>TO_EVERY+1){q-=.6;cat='wear';}
  if(vehOn(r.ref)<=1&&demand()>=.9){q-=.8;cat='crowd';}
  if(coverage()<.5){q-=.5;cat='chaos';}
  if(v.conductor)q+=.3;
  if(v.eq){q-=1.3;cat=v.eq;}
  if(rs.ev){q-=.9;cat=rs.ev.kind;}
  q+=(Math.random()-.5)*1.2;
  const rating=Math.max(1,Math.min(5,Math.round(q)));
  if(rating>=4)cat=(rating===5||Math.random()<.4)?'great':'ok';
  else if(v.eq&&Math.random()<.7)cat=v.eq;
  addReview(r.ref,v.num,rating,cat,v.driver);
}
const avg=list=>list.length?list.reduce((a,b)=>a+eff(b),0)/list.length:0;
function parkRating(){const l=S.reviews.slice(0,30);return l.length?avg(l):4;}
function routeRating(ref){const l=S.reviews.filter(x=>x.ref===ref).slice(0,15);return {n:l.length,v:avg(l)};}
const satisfaction=()=>Math.max(.8,Math.min(1.2,.85+(parkRating()-3)*.1));
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const REPLIES={
  sorry:{label:'Извиниться',text:'Приносим извинения, мы разберёмся и исправим.',adj:1},
  explain:{label:'Объяснить причину',text:'Спасибо за обращение. Это временные обстоятельства, мы работаем над этим.',adj:0},
  comp:{label:'Компенсировать · 100 ₽',text:'Приносим извинения и возвращаем стоимость поездки.',adj:2,cost:100},
  thanks:{label:'Поблагодарить',text:'Спасибо за тёплый отзыв! Передадим водителю.',adj:0}
};

/* ---------- симуляция ---------- */
const floaters=[];
function earn(v,r){
  const m=MBY[v.model],rs=RS(r.ref);
  const mult=satisfaction()*(rs.ev?rs.ev.inc:1)*(.9+.1*coverage())*(v.conductor?1.12:1)*(v.eq==='validator'?.8:1);
  const gross=m.cap*demand()*FARE*0.2*Math.max(.7,Math.min(1.4,r.len/11))*mult;
  const net=Math.max(40,Math.round(gross-r.len*8));
  S.money+=net;S.total+=net;S.mInc+=net;v.earned+=net;
  const [x,y]=posAt(r,v.d);
  floaters.push({x,y,t:0,txt:'+'+net+' ₽'});
}
function hazard(v){
  const over=Math.max(0,v.sinceTO-TO_EVERY);
  return (0.0001+Math.pow(v.wear/100,2)*0.004+over*0.0004)*(v.test?1.6:1);
}
function quit(d){
  for(const v of S.vehicles){
    if(v.driver===d.id){if(v.status==='line'){v.status='depot';v.d=0;v.phase='work';}v.driver=null;}
    if(v.conductor===d.id)v.conductor=null;
    if(v.mech===d.id)v.mech=null;
  }
  S.staff=S.staff.filter(x=>x.id!==d.id);
  addLog(ROLES[d.role].name+' '+d.name+' уволился по собственному желанию.');toast('Уволился: '+ROLES[d.role].name.toLowerCase()+' '+d.name);
}
const HOLIDAYS={0:'Новый год',1:'День защитника Отечества',2:'8 Марта',4:'Праздник Весны и Труда и День Победы',5:'День России',10:'День народного единства'};
const GIFT=5000,SHIFT_BONUS=2000;
function dayEnd(){
  const trips=S.dayTrips|0,bad=S.dayBad|0;
  if(trips>=5&&bad*15<=trips){S.money+=SHIFT_BONUS;S.total+=SHIFT_BONUS;addLog('Смена отработана почти без жалоб ('+trips+' рейсов, жалоб '+bad+'): премия от администрации '+fmt(SHIFT_BONUS)+'.');toast('Премия за смену: +'+fmt(SHIFT_BONUS));}
  else if(trips>0)addLog('Смена закончена: рейсов '+trips+', жалоб '+bad+'. '+(bad?'Премии нет: жалоб больше 7% от рейсов.':'Премии нет: мало рейсов (нужно от 5).'));
  S.dayTrips=0;S.dayBad=0;
}
function monthly(){
  const hol=HOLIDAYS[(Math.floor(S.month)+10)%12];
  if(hol){S.money+=GIFT;addLog('Праздник: '+hol+'. Подарок от администрации '+fmt(GIFT)+'.');toast(hol+': подарок '+fmt(GIFT));}
  const wages=S.staff.reduce((a,d)=>a+d.wage,0)+CENTRAL.wage+BORT.reduce((a,b)=>a+b.wage,0);
  const paid=Math.min(S.money,wages);S.money-=paid;
  const short=paid<wages;
  for(const d of [...S.staff]){
    let dm=0;
    if(d.role==='driver'||d.role==='conductor'){const v=d.vid&&S.vehicles.find(x=>x.id===d.vid);dm=(v&&v.status==='line')?3:-1;}
    else if(d.role==='mechanic')dm=d.busy?3:-1;
    else dm=1;
    if(short)dm-=6;
    d.mood=Math.max(d.core?50:0,Math.min(100,d.mood+dm));
    if(!d.core&&Math.random()<(d.mood<25?.1:.01))quit(d);
  }
  addLog('Итоги месяца ('+dateStr()+'): выручка '+fmt(S.mInc)+', зарплата '+fmt(paid)+', содержание маршрутов '+fmt(S.mUp)+'.'+(short?' Зарплату выплатили не полностью.':''));
  S.mInc=0;S.mUp=0;
}
function launch(v,silent){
  const say=t=>{if(!silent)toast(t);};
  if(v.status!=='depot')return false;
  if(RS(v.route).mothball){say('Маршрут №'+v.route+' законсервирован');return false;}
  if(v.wear>=70){say('Троллейбус №'+v.num+' слишком изношен, нужен КВР');return false;}
  const h=hourNow();
  if(h>=0.5&&h<5){say('Выпуск на линию разрешён с 5:00');return false;}
  const d=S.staff.find(x=>x.role==='driver'&&x.vid==null);
  if(!d){say('Нет свободных водителей. Наймите кого-нибудь на вкладке «Штат».');return false;}
  const c=S.staff.find(x=>x.role==='conductor'&&x.vid==null);
  d.vid=v.id;v.driver=d.id;
  if(c){c.vid=v.id;v.conductor=c.id;}
  v.status='line';setZero(v,'zero');v.d=0;v.dir=1;v.dwell=0;
  return true;
}
function launchAll(silent){
  let n=0;
  for(const v of [...S.vehicles].sort((a,b)=>a.wear-b.wear))if(launch(v,true))n++;
  if(!silent)toast(n?'Выпущено троллейбусов: '+n+' (нулевые рейсы из депо)':'Некого выпускать: проверьте водителей, маршруты и износ');
  if(n)addLog('Выпущено на линию: '+n+'. Нулевые рейсы из депо на Московской улице до начальных конечных, без посадки.');
  return n;
}
function startService(v,kind,silent){
  const m=freeMechanic();
  if(!m){if(!silent)toast('Нет свободного механика');return false;}
  const c=kind==='kvr'?costKVR(v):costTO(v);
  if(S.money<c){if(!silent)toast('Не хватает денег: нужно '+fmt(c));return false;}
  S.money-=c;m.busy=true;v.mech=m.id;v.status=kind;v.timer=kind==='kvr'?60:8;
  addLog('Троллейбус №'+v.num+' поставлен на '+(kind==='kvr'?'КВР':'ТО')+' ('+fmt(c)+'), механик '+m.name+'.');
  return true;
}
function deputyRoutine(){
  let to=0;
  for(const v of S.vehicles)if(v.status==='depot'&&v.sinceTO>=TO_EVERY&&startService(v,'service',true))to++;
  const n=launchAll(true);
  addLog('Заместитель: на ТО поставлено '+to+', выпущено на линию '+n+'.');
}
function deputyWork(){
  // отзывы: заместитель отвечает сам
  let n=0;
  for(const x of S.reviews){
    if(x.reply||n>=3)continue;
    const k=x.rating>=4?'thanks':(['detour','blocked','broke','closed'].includes(x.cat)?'explain':'sorry'),o=REPLIES[k];
    x.reply=o.text;x.by='deputy';let g=o.adj;if(k==='explain')g=1;x.adj=Math.min(5-x.rating,g);n++;
  }
  if(n)addLog('Заместитель ответил на отзывы: '+n+'.');
  // выпуск: самый неизношенный свободный троллейбус
  const h=hourNow();
  if(h>=5&&h<23.5){
    const v=S.vehicles.filter(x=>x.status==='depot'&&x.wear<KVR_WEAR&&!RS(x.route).mothball&&!x.test||x.status==='depot'&&x.test&&!RS(x.route).mothball).sort((a,b)=>a.wear-b.wear)[0];
    if(v&&launch(v,true))addLog('Заместитель выпустил на линию троллейбус №'+v.num+' (износ '+Math.round(v.wear)+'%).');
  }
}
function step(dt){
  S.T+=dt;S.clock+=dt*SCALE;
  const dm=dt*CAL;S.month+=dm;
  let na=0;for(const r of ROUTES)if(!RS(r.ref).mothball)na++;
  const upk=UPKEEP*(staffBy('deputy').length?.8:1);
  const up=Math.min(S.money,upk*na*dt*SCALE);S.money-=up;S.mUp+=up;
  for(const v of S.vehicles){
    v.wear=Math.min(100,v.wear+MBY[v.model].wearYr/12*dm);v.sinceTO+=dm;
    if(v.sinceTO>=TO_EVERY&&!v.toWarned){v.toWarned=true;addLog('Троллейбусу №'+v.num+' пора на ТО.');}
  }
  if(Math.floor(S.month)>S.lastMonth){S.lastMonth=Math.floor(S.month);monthly();}
  const day=Math.floor(S.clock/1440),hr=hourNow();
  if(S.day===undefined)S.day=day;
  if(day>S.day){S.day=day;dayEnd();}
  if(hr>=6&&hr<7&&S.autoDay!==day){S.autoDay=day;if(staffBy('deputy').length)deputyRoutine();}
  if(staffBy('deputy').length&&S.T>=(S.depAt|0)){S.depAt=S.T+8;deputyWork();}
  if(!staffBy('deputy').length&&!S.cands.some(c=>c.role==='deputy')&&S.T>=(S.depCandAt|0)&&S.T>25){S.depCandAt=S.T+300;S.cands.push(Object.assign({id:S.nextStaff++,until:S.T+600},person('deputy')));addLog('Появился отклик на должность заместителя. Откройте «Парк» → «Штат».');toast('Отклик: заместитель');}
  for(const r of ROUTES){const rs=RS(r.ref);if(rs.ev&&S.T>=rs.ev.until){addLog('Маршрут №'+r.ref+': движение восстановлено.');rs.ev=null;}}
  if(S.T>=S.evAt){
    S.evAt=S.T+80+Math.random()*70;
    const cand=ROUTES.filter(r=>!RS(r.ref).mothball&&!RS(r.ref).ev);
    const withVeh=cand.filter(r=>vehOn(r.ref)>0);
    const pool=withVeh.length?withVeh:cand;
    if(pool.length){
      const r=pick(pool),e=pick(EVENTS);
      RS(r.ref).ev={kind:e.kind,label:e.label,inc:e.inc,until:S.T+e.dur};
      addLog('Маршрут №'+r.ref+': '+e.label+'.');toast('Маршрут №'+r.ref+': '+e.label);
      const n=vehOn(r.ref);
      for(let i=0;i<Math.min(2,n);i++)addReview(r.ref,0,1+Math.floor(Math.random()*2),e.kind);
    }
  }
  if(Math.random()<dt*0.01){
    const closed=ROUTES.filter(r=>RS(r.ref).mothball);
    if(closed.length)addReview(pick(closed).ref,0,1+Math.floor(Math.random()*2),'closed');
  }
  S.cands=S.cands.filter(c=>S.T<c.until);
  if(S.T>=S.candAt){
    S.candAt=S.T+20+Math.random()*20;
    if(S.cands.length<8){
      const w=['driver','driver','driver','driver','driver','conductor','conductor','conductor','dispatcher','mechanic'];
      if(!staffBy('deputy').length)w.push('deputy');
      S.cands.push(Object.assign({id:S.nextStaff++,until:S.T+240},person(pick(w))));
    }
  }
  const cov=coverage();
  let fixing=S.vehicles.filter(v=>v.eqFixing).length;
  for(const v of S.vehicles){
    if(v.eq==='dead'&&v.status==='line'&&v.phase==='work'){setZero(v,'back');addLog('Троллейбус №'+v.num+': бортовое оборудование полностью вышло из строя, снят с линии и идёт в депо.');}
    if(v.eq){
      const deadAtLine=v.eq==='dead'&&v.status!=='depot';
      if(!v.eqFixing&&!deadAtLine&&fixing<BORT.length){
        v.eqFixing=true;fixing++;v.eqT=v.eq==='dead'?12:v.status==='line'?22:7;
        addLog(v.eq==='dead'?'Бортовик '+BORT[0].name+' занимается оборудованием троллейбуса №'+v.num+' в депо.':'Помощник бортовика '+BORT[1].name+' выехал чинить '+EQ[v.eq]+' на троллейбусе №'+v.num+'.');
      }
      else if(v.eqFixing){
        v.eqT-=dt;
        if(v.eqT<=0){const c=charge(v.eq==='dead'?300:100);addLog('Бортовик починил '+(v.eq==='dead'?'бортовое оборудование':EQ[v.eq])+' на троллейбусе №'+v.num+' ('+fmt(c)+').');v.eq=null;v.eqFixing=false;}
      }
    }else if(v.status==='line'&&v.phase==='work'&&Math.random()<dt*0.0004){
      v.eq=pick(['informer','informer','informer','validator','display','dead']);
      addLog('Троллейбус №'+v.num+': '+(v.eq==='dead'?'вышло из строя всё бортовое оборудование':'не работает '+EQ[v.eq])+'.');
      if(Math.random()<.6)addReview(v.route,v.num,v.eq==='dead'?1:2+Math.floor(Math.random()*2),v.eq,v.driver);
    }
  }
  for(const v of S.vehicles){
    const m=MBY[v.model];
    if(v.status==='service'||v.status==='kvr'){
      v.timer-=dt;
      if(v.timer<=0){
        if(v.status==='service'){v.sinceTO=0;v.toWarned=false;addLog('ТО троллейбуса №'+v.num+' завершено.');}
        else{v.wear=4;v.sinceTO=0;v.toWarned=false;v.kvrs++;addLog('КВР троллейбуса №'+v.num+' завершён: износ сброшен.');}
        freeMech(v);v.status='depot';v.d=0;v.dir=1;
      }
      continue;
    }
    if(v.status==='broken'){                       // ждёт слесаря
      const mech=freeMechanic();
      if(mech){
        mech.busy=true;v.mech=mech.id;v.status='mechgo';v.timer=(6+Math.random()*4)*(1.5-.5*cov);
        addLog('К троллейбусу №'+v.num+' выехал слесарь '+mech.name+'.');
      }
      continue;
    }
    if(v.status==='mechgo'){                       // слесарь едет к троллейбусу
      v.timer-=dt;
      if(v.timer<=0){
        if(v.severe){
          const c=charge(costTR(v));
          const dr=byId(v.driver);release(v);
          v.status='tow';v.timer=20;
          addLog('Троллейбус №'+v.num+': на линии не починить, его везут в парк (ремонт '+fmt(c)+').');
        }else{
          v.status='fixing';v.timer=6;
          addLog('Слесарь устраняет неисправность троллейбуса №'+v.num+' прямо на линии.');
        }
      }
      continue;
    }
    if(v.status==='fixing'){
      v.timer-=dt;
      if(v.timer<=0){
        const c=charge(150+v.wear*2);freeMech(v);v.status='line';v.dwell=1;
        addLog('Троллейбус №'+v.num+' починен на линии ('+fmt(c)+') и продолжает рейс.');
      }
      continue;
    }
    if(v.status==='tow'){
      v.timer-=dt;
      if(v.timer<=0){v.status='repair';v.timer=15;addLog('Троллейбус №'+v.num+' доставлен в парк, идёт техремонт.');}
      continue;
    }
    if(v.status==='repair'){
      v.timer-=dt;
      if(v.timer<=0){freeMech(v);v.status='depot';v.d=0;v.dir=1;v.phase='work';addLog('Троллейбус №'+v.num+' отремонтирован и стоит в депо.');}
      continue;
    }
    if(v.status!=='line')continue;
    const r=RBY[v.route];
    if(!v.driver){v.status='depot';v.d=0;v.phase='work';continue;}
    if(v.phase==='zero'||v.phase==='back'){        // нулевой рейс без пассажиров
      v.zeroLeft-=dt*SCALE;
      if(v.zeroLeft<=0){
        if(v.phase==='zero'){v.phase='work';v.d=0;v.dir=1;v.dwell=0;}
        else{release(v);v.status='depot';v.d=0;v.phase='work';}
      }
      continue;
    }
    if(hr>=0.5&&hr<5){setZero(v,'back');continue;}  // ночью возврат в парк
    if(v.dwell>0){v.dwell-=dt;continue;}
    if(RS(v.route).ev&&RS(v.route).ev.kind==='blocked')continue;
    if(Math.random()<hazard(v)*dt){
      v.status='broken';
      v.severe=Math.random()<Math.min(.7,.1+v.wear/250+Math.max(0,v.sinceTO-TO_EVERY)*.05);
      const d=byId(v.driver);if(d)d.mood=Math.max(d.core?50:0,d.mood-3);
      addLog('Троллейбус №'+v.num+' ('+m.name+') сломался на маршруте №'+v.route+'. Вызван слесарь.');
      toast('Поломка: троллейбус №'+v.num);
      addReview(r.ref,v.num,1+Math.floor(Math.random()*2),'broke',v.driver);
      continue;
    }
    v.d+=v.dir*SPEED*SCALE*dt;
    if(v.d>=r.len||v.d<=0){
      v.d=Math.max(0,Math.min(r.len,v.d));
      earn(v,r);v.trips++;S.dayTrips=(S.dayTrips|0)+1;maybeReview(v,r);
      v.dir*=-1;v.dwell=3;
    }
  }
  for(let i=S.vehicles.length-1;i>=0;i--){
    const v=S.vehicles[i];
    if(v.test&&S.T>=v.expires&&!isOut(v)){
      const bonus=1500+v.trips*120;
      S.money+=bonus;S.total+=bonus;release(v);freeMech(v);
      addLog('Испытания '+MBY[v.model].name+' завершены, троллейбус возвращён заводу. Премия '+fmt(bonus)+'.');
      toast('Испытания завершены: +'+fmt(bonus));
      S.vehicles.splice(i,1);
    }
  }
  if(!S.offer&&S.T>=S.offerAt){
    S.offer={model:pick(['v522','v529','avg']),dur:240};
    addLog('Завод предлагает троллейбус на испытания. Предложение на вкладке «Парк».');
    toast('Предложение: троллейбус на испытания');
  }
  for(let i=floaters.length-1;i>=0;i--){floaters[i].t+=dt;if(floaters[i].t>1.6)floaters.splice(i,1);}
}

/* ---------- действия ---------- */
function spend(c){if(S.money<c){toast('Не хватает денег: нужно '+fmt(c));return false;}S.money-=c;return true;}
function act(a,id,val){
  const v=S.vehicles.find(x=>x.id===id);
  if(a==='launch'&&v){
    if(launch(v)){const d=byId(v.driver);addLog('Троллейбус №'+v.num+' выпущен на маршрут №'+v.route+', водитель '+d.name+'. Нулевой рейс из депо.');}
  }
  if(a==='launchall')launchAll();
  if(a==='recallall'){let n=0;for(const x of S.vehicles)if(x.status==='line'&&x.phase!=='back'){setZero(x,'back');n++;}toast(n?'Возвращаются в парк: '+n:'На линии никого нет');}
  if(a==='recall'&&v&&v.status==='line'){setZero(v,'back');addLog('Троллейбус №'+v.num+' снят с линии, идёт в парк.');}
  if(a==='route'&&v&&v.status==='depot'){v.route=val;}
  if(a==='service'&&v&&v.status==='depot')startService(v,'service');
  if(a==='kvr'&&v&&v.status==='depot')startService(v,'kvr');
  if(a==='contractor'&&v&&v.status==='broken'){
    if(!spend(CONTRACTOR))return;
    v.status='mechgo';v.timer=14;v.mech=null;
    addLog('Для троллейбуса №'+v.num+' вызвана сторонняя бригада: '+fmt(CONTRACTOR)+'.');
  }
  if(a==='buy'){
    const m=MBY[val],fu=freeUnits(val);
    if(!fu.length)return toast('Свободных номеров этой модели нет');
    const u=fu[0],price=unitPrice(u);if(!spend(price))return;
    const nv=newVehicle(val,{unit:u});S.vehicles.push(nv);
    addLog('Куплен '+m.name+' №'+nv.num+' за '+fmt(price)+'.');toast('Куплен '+m.name+' №'+nv.num);
  }
  if((a==='sell'||a==='scrap')&&v){
    if(v.status!=='depot')return toast('Сначала верните троллейбус в депо');
    if(v.test)return toast('Испытуемый троллейбус принадлежит заводу');
    if(!(SURE.id===id&&SURE.a===a&&Date.now()-SURE.t<4000)){SURE={id,a,t:Date.now()};return toast('Нажмите ещё раз, чтобы '+(a==='sell'?'продать':'списать')+' №'+v.num);}
    SURE={id:0,a:'',t:0};
    const sum=a==='sell'?sellPrice(v):scrapPrice(v);
    S.money+=sum;freeMech(v);release(v);S.vehicles=S.vehicles.filter(x=>x!==v);
    addLog((a==='sell'?'Продан':'Списан и сдан в металлолом')+' троллейбус №'+v.num+' ('+MBY[v.model].name+'): '+fmt(sum)+'.');
    toast((a==='sell'?'Продан':'Списан')+' №'+v.num+': +'+fmt(sum));
  }
  if(a==='accept'&&S.offer){
    const o=S.offer;S.offer=null;S.offerAt=S.T+150;
    const nv=newVehicle(o.model,{unit:freeUnits(o.model)[0]||null,fresh:true,test:true,expires:S.T+o.dur});S.vehicles.push(nv);
    addLog('Принят на испытания '+MBY[o.model].name+' №'+nv.num+' на '+Math.round(o.dur/60)+' мин.');
  }
  if(a==='decline'&&S.offer){S.offer=null;S.offerAt=S.T+120;}
  if(a==='mothball'){
    const rs=RS(val);
    if(!rs.mothball){
      rs.mothball=true;rs.ev=null;
      S.vehicles.forEach(x=>{if(x.route===val&&x.status==='line'){setZero(x,'back');}});
      addLog('Маршрут №'+val+' законсервирован, троллейбусы возвращаются в депо.');
    }else{
      if(!spend(500))return;rs.mothball=false;addLog('Маршрут №'+val+' расконсервирован: '+fmt(500)+'.');
    }
  }
  if(a==='hire'){
    const c=S.cands.find(x=>x.id===id);if(!c)return;
    if(c.role==='deputy'&&staffBy('deputy').length)return toast('Заместитель уже назначен');
    S.cands=S.cands.filter(x=>x.id!==id);
    S.staff.push({id:c.id,name:c.name,role:c.role,exp:c.exp,wage:c.wage,mood:70,vid:null,busy:false});
    addLog('Принят на работу: '+ROLES[c.role].name.toLowerCase()+' '+c.name+' ('+fmt(c.wage)+' в месяц).');
  }
  if(a==='reject'){S.cands=S.cands.filter(x=>x.id!==id);}
  if(a==='fire'){
    const d=byId(id);if(!d)return;
    if(d.vid||d.busy)return toast('Сейчас он на работе: дождитесь окончания смены');
    if(!spend(d.wage))return;
    S.staff=S.staff.filter(x=>x.id!==id);addLog('Уволен: '+ROLES[d.role].name.toLowerCase()+' '+d.name+', выходное пособие '+fmt(d.wage)+'.');
  }
  if(a==='reply'){
    const r=S.reviews.find(x=>x.id===id),o=REPLIES[val];
    if(!r||!o||r.reply)return;
    if(o.cost&&!spend(o.cost))return;
    r.reply=o.text;
    let gain=o.adj;
    if(val==='explain'&&['detour','blocked','broke','closed'].includes(r.cat))gain=1;
    r.adj=Math.min(5-r.rating,gain);
    if(val==='thanks'){const d=byId(r.did);if(d)d.mood=Math.min(100,d.mood+8);}
    replyOpen=0;
  }
  if(a==='promo'){
    const inp=$('#promo'),code=inp?inp.value.trim():'';
    if(!code)return toast('Введите промокод');
    const p=PROMOS[cyrb53('trl:'+code,7)];
    if(!p)return toast('Промокод не найден');
    S.money+=p.sum;
    addLog('Промокод активирован: '+fmt(p.sum)+' на баланс.');toast('Промокод принят: +'+fmt(p.sum));
    inp.value='';
  }
  if(a==='reset'){const pr=S.promos;startGame();S.promos=pr;}
  renderAll();
}

function statusPill(v){
  if(v.status==='line'){
    if(v.phase==='zero')return '<span class="pill warn">Нулевой рейс · '+Math.ceil(v.zeroLeft/SCALE)+' с</span>';
    if(v.phase==='back')return '<span class="pill warn">Возврат в парк · '+Math.ceil(v.zeroLeft/SCALE)+' с</span>';
    return '<span class="pill line">На линии · №'+v.route+'</span>';
  }
  if(v.status==='broken')return '<span class="pill bad">Поломка, ждёт слесаря</span>';
  if(v.status==='mechgo')return '<span class="pill bad">Слесарь едет · '+Math.ceil(v.timer)+' с</span>';
  if(v.status==='fixing')return '<span class="pill warn">Ремонт на линии · '+Math.ceil(v.timer)+' с</span>';
  if(v.status==='tow')return '<span class="pill bad">Везут в парк · '+Math.ceil(v.timer)+' с</span>';
  if(v.status==='repair')return '<span class="pill warn">Техремонт · '+Math.ceil(v.timer)+' с</span>';
  if(v.status==='service')return '<span class="pill warn">В смотровой (ТО) · '+Math.ceil(v.timer)+' с</span>';
  if(v.status==='kvr')return '<span class="pill warn">КВР · '+Math.ceil(v.timer)+' с</span>';
  return '<span class="pill">В депо</span>';
}

  h+='<h2 style="margin-top:18px">Промокод</h2><div class="btns"><input id="promo" type="text" inputmode="numeric" autocomplete="off" placeholder="Введите промокод" style="flex:1;min-width:140px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit"><button class="btn pri" data-act="promo">Активировать</button></div>';
  h+='<div class="btns"><button class="btn" id="resetbtn">Начать заново</button></div>';
  const el=$('#routes');if(el._h===h)return;
  setHTML(el,h);
  const rb=$('#resetbtn');
  rb.onclick=()=>{if(rb.dataset.sure){act('reset');}else{rb.dataset.sure=1;rb.textContent='Точно? Нажмите ещё раз';}};
}
function reviewHtml(x){
  const e=eff(x),c=e>=4?'hi':e===3?'mid':'lo';
  let h='<div class="rev"><div class="row"><span class="stars '+c+'">'+stars(e)+'</span><span>'+badge(x.ref)+(x.num?' <span class="mut">№'+x.num+'</span>':'')+'</span></div><p>'+esc(x.text)+'</p><div class="mut">'+x.who+' · '+x.t+'</div>';
  if(x.reply)h+='<div class="reply"><b>'+(x.by==='deputy'?'Ответ заместителя':'Ответ парка')+(x.adj?' · оценка выросла на '+x.adj:'')+'</b>'+esc(x.reply)+'</div>';
  else if(replyOpen===x.id){
    const keys=x.rating>=4?['thanks']:['sorry','explain','comp'];
    h+='<div class="btns" data-rid="'+x.id+'">'+keys.map(k=>'<button class="btn" data-act="reply" data-val="'+k+'">'+REPLIES[k].label+'</button>').join('')+'<button class="btn" data-act="replyclose">Отмена</button></div>';
  }else h+='<div class="btns"><button class="btn" data-act="replyopen" data-rid="'+x.id+'">Ответить</button></div>';
  return h+'</div>';
}
function renderLog(){
  const r=S.reviews;
  let h='<div class="seg"><button data-seg="events" class="'+(logTab==='events'?'on':'')+'">События</button><button data-seg="reviews" class="'+(logTab==='reviews'?'on':'')+'">Отзывы'+(r.length?' · '+r.length:'')+'</button></div>';
  if(logTab==='events'){
    h+=S.log.length?'<ul class="log">'+S.log.map(l=>'<li><time>'+l.t+'</time>'+l.text+'</li>').join('')+'</ul>':'<div class="empty">Событий пока нет.</div>';
  }else{
    const pr=parkRating();
    h+='<div class="sum"><span class="big">'+(r.length?num1(pr):'—')+'</span><span class="mut">средняя оценка парка по последним '+Math.min(30,r.length)+' отзывам. Спрос на '+Math.abs(Math.round((satisfaction()-1)*100))+'% '+(satisfaction()>=1?'выше':'ниже')+' обычного. Ответ на жалобу поднимает оценку.</span></div>';
    h+=r.length?r.map(reviewHtml).join(''):'<div class="empty">Отзывов пока нет. Пассажиры оставят их после первых рейсов.</div>';
  }
  setHTML($('#logv'),'<h2>Лента</h2>'+h);
}
function renderLegend(){
  $('#legend').innerHTML=ROUTES.map(r=>{const rs=RS(r.ref);return '<span class="lg'+(hiRoute&&hiRoute!==r.ref?' dim':'')+'"><span class="dot" style="background:'+(rs.mothball?'var(--muted)':r.color)+'"></span>№'+r.ref+(rs.mothball?' · консерв.':rs.ev?' · !':'')+'</span>';}).join('');
}
function renderHeader(){
  $('#money').textContent=fmt(S.money);
  $('#clock').textContent=clockStr();
  $('#date').textContent=dateStr();
  $('#rating').textContent='★ '+(S.reviews.length?num1(parkRating()):'—');
  $('#lvl').textContent='Ур. '+level();
  $('#lvlbar').style.width=((S.total%6000)/6000*100)+'%';
  $('#online').textContent='На линии: '+S.vehicles.filter(isOut).length;
  $('#nfleet').textContent='Парк '+S.vehicles.length;
  if(PLAYER)$('#title').textContent='Парк: '+PLAYER;
}
function renderAll(){renderHeader();renderLegend();if(tab==='fleet')renderFleet();if(tab==='routes')renderRoutes();if(tab==='log')renderLog();}
function setTab(t){
  tab=t;
  for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-selected',b.dataset.tab===t);
  for(const k of ['map','fleet','routes','log'])$('#v-'+k).hidden=(k!==t);
  if(t==='map')resize();
  renderAll();
}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab);});
document.addEventListener('click',e=>{
  const sg=e.target.closest('[data-seg]');if(sg){logTab=sg.dataset.seg;renderAll();return;}
  const ft=e.target.closest('[data-ft]');if(ft){fleetTab=ft.dataset.ft;renderAll();return;}
  const b=e.target.closest('[data-act]');
  if(b){
    const a=b.dataset.act;
    if(a==='replyopen'){replyOpen=+b.dataset.rid;renderAll();return;}
    if(a==='replyclose'){replyOpen=0;renderAll();return;}
    const rid=b.closest('[data-rid]');
    const card=b.closest('[data-id]');
    act(a,rid?+rid.dataset.rid:card?+card.dataset.id:null,b.dataset.val);return;
  }
  const h=e.target.closest('[data-hi]');
  if(h){hiRoute=hiRoute===h.dataset.hi?null:h.dataset.hi;setTab('map');}
});
document.addEventListener('change',e=>{
  const s=e.target.closest('select[data-route]');
  if(s){const card=s.closest('[data-id]');act('route',+card.dataset.id,s.value);}
});

/* ---------- карта (canvas) ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
const view={s:1,ox:0,oy:0};
let W=0,H=0,DPR=1;
function fit(){
  const bw=BB.x1-BB.x0,bh=BB.y1-BB.y0,pad=46;
  const s=Math.min((W-pad*2)/bw,(H-pad*2)/bh);
  view.s=s;view.ox=(W-bw*s)/2-BB.x0*s;view.oy=(H-bh*s)/2-BB.y0*s;
}
function resize(){
  W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*DPR;cv.height=H*DPR;
  if(!resize.done){fit();resize.done=true;}
}
window.addEventListener('resize',resize);
const P=(x,y)=>[x*view.s+view.ox,y*view.s+view.oy];
function zoomAt(px,py,f){
  const ns=Math.max(8,Math.min(600,view.s*f));f=ns/view.s;
  view.ox=px-(px-view.ox)*f;view.oy=py-(py-view.oy)*f;view.s=ns;
}
$('#zin').onclick=()=>zoomAt(W/2,H/2,1.5);
$('#zout').onclick=()=>zoomAt(W/2,H/2,1/1.5);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15);},{passive:false});
const ptrs=new Map();let lastPinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);lastPinch=0;});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const old=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){view.ox+=e.clientX-old[0];view.oy+=e.clientY-old[1];}
  else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastPinch){const r=cv.getBoundingClientRect();zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/lastPinch);}
    lastPinch=d;
  }
});
const endp=e=>{ptrs.delete(e.pointerId);lastPinch=0;};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let TH={};
function readTheme(){TH={water:css('--water'),road:css('--road'),map:css('--map'),grid:css('--grid'),fg:css('--fg'),muted:css('--muted'),surface:css('--surface'),bad:css('--bad'),good:css('--good'),accent:css('--accent'),warn:css('--warn')};}
readTheme();setInterval(readTheme,1000);

function drawBase(){
  if(BASE.waterLinesK.length){
    ctx.strokeStyle=TH.water;ctx.lineCap='round';ctx.lineJoin='round';
    for(const w of BASE.waterLinesK){ctx.lineWidth=Math.max(6,w.w*view.s);ctx.beginPath();w.p.forEach(([x,y],i)=>{const [X,Y]=P(x,y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.stroke();}
  }
  if(BASE.waterK.length){
    ctx.fillStyle=TH.water;
    for(const poly of BASE.waterK){
      ctx.beginPath();
      for(const ring of poly){ring.forEach(([x,y],i)=>{const [X,Y]=P(x,y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.closePath();}
      ctx.fill('evenodd');
    }
  }
  if(BASE.roadsK.length){
    ctx.strokeStyle=TH.road;ctx.lineCap='round';ctx.lineJoin='round';
    const z=Math.max(.7,Math.min(2,view.s/28));
    for(let c=3;c>=0;c--){
      ctx.lineWidth=BASEW[c]*z;ctx.beginPath();
      for(const r of BASE.roadsK){if(r.c!==c)continue;r.p.forEach(([x,y],i)=>{const [X,Y]=P(x,y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});}
      ctx.stroke();
    }
  }
}
/* иконка троллейбуса на карте: вид сверху, рога тянутся к проводам */
function drawTrolley(X,Y,ang,color,alpha,model){
  if(model==='bkm')return drawBkm(X,Y,ang,color,alpha);
  const z=Math.max(.95,Math.min(1.9,view.s/38));
  ctx.save();ctx.translate(X,Y);ctx.rotate(ang);ctx.scale(z,z);ctx.globalAlpha=alpha;
  ctx.strokeStyle=TH.fg;ctx.lineWidth=1;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4,-1);ctx.lineTo(-13,-5.5);ctx.moveTo(-4,1);ctx.lineTo(-13,5.5);ctx.stroke();
  ctx.fillStyle=color;ctx.strokeStyle=TH.surface;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.roundRect(-10,-4.6,20,9.2,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<3;i++)ctx.fillRect(-7.5+i*4.6,-3.1,3.2,6.2);
  ctx.fillStyle='rgba(20,30,28,.75)';ctx.fillRect(6.2,-3.4,2.8,6.8);
  ctx.restore();
}
function drawBkm(X,Y,ang,color,alpha){
  const z=Math.max(.95,Math.min(1.9,view.s/38));
  ctx.save();ctx.translate(X,Y);ctx.rotate(ang);ctx.scale(z,z);ctx.globalAlpha=alpha;
  ctx.strokeStyle=TH.fg;ctx.lineWidth=1;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-5,-1);ctx.lineTo(-15,-5.5);ctx.moveTo(-5,1);ctx.lineTo(-15,5.5);ctx.stroke();
  ctx.fillStyle=color;ctx.strokeStyle=TH.surface;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.roundRect(-12,-4.8,24,9.6,3.2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#3fa9f5';ctx.beginPath();ctx.roundRect(8,-4.8,4,9.6,[0,2,2,0]);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.92)';
  for(let i=0;i<4;i++)ctx.fillRect(-9.5+i*4.6,-3.2,3.3,6.4);
  ctx.fillStyle='rgba(20,30,28,.8)';ctx.fillRect(6.2,-3.6,2.6,7.2);
  ctx.restore();
}
function draw(){
  if(!W||!H)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=TH.map;ctx.fillRect(0,0,W,H);
  drawBase();
  ctx.strokeStyle=TH.grid;ctx.lineWidth=1;ctx.beginPath();
  const gx0=Math.floor((0-view.ox)/view.s),gx1=Math.ceil((W-view.ox)/view.s),gy0=Math.floor((0-view.oy)/view.s),gy1=Math.ceil((H-view.oy)/view.s);
  const stepKm=view.s<18?5:view.s<50?2:1;
  for(let x=Math.floor(gx0/stepKm)*stepKm;x<=gx1;x+=stepKm){const X=x*view.s+view.ox;ctx.moveTo(X,0);ctx.lineTo(X,H);}
  for(let y=Math.floor(gy0/stepKm)*stepKm;y<=gy1;y+=stepKm){const Y=y*view.s+view.oy;ctx.moveTo(0,Y);ctx.lineTo(W,Y);}
  ctx.stroke();
  ctx.lineJoin='round';ctx.lineCap='round';
  const order=ROUTES.map((r,i)=>[r,i]);
  if(hiRoute)order.sort((a,b)=>(a[0].ref===hiRoute)-(b[0].ref===hiRoute));
  for(const [r,i] of order){
    const rs=RS(r.ref),dim=hiRoute&&hiRoute!==r.ref;
    ctx.globalAlpha=rs.mothball?.55:dim?.18:.95;
    ctx.strokeStyle=rs.mothball?TH.muted:r.color;
    ctx.lineWidth=rs.mothball?2:hiRoute===r.ref?9:2.4+(ROUTES.length-1-i)*1.0;
    ctx.setLineDash(rs.mothball?[2,6]:rs.ev?[11,7]:[]);
    ctx.beginPath();
    r.xy.forEach(([x,y],i)=>{const [X,Y]=P(x,y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.stroke();
  }
  ctx.setLineDash([]);ctx.globalAlpha=1;
  const showNames=view.s>55,rad=view.s>40?3.2:2.2;
  ctx.font='500 10px Inter,system-ui,sans-serif';ctx.textBaseline='middle';
  const TERM=new Set();for(const r of ROUTES){TERM.add(r.from);TERM.add(r.to);}
  for(const s of STOPS_K){
    if(TERM.has(s.name))continue;
    if(!s.refs.some(rf=>!RS(rf).mothball))continue;
    if(hiRoute&&!s.refs.includes(hiRoute))continue;
    const [X,Y]=P(s.p[0],s.p[1]);
    if(X<-20||X>W+20||Y<-20||Y>H+20)continue;
    ctx.fillStyle=TH.surface;ctx.strokeStyle=TH.fg;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(X,Y,rad,0,7);ctx.fill();ctx.stroke();
    if(showNames&&s.name){
      ctx.lineWidth=3;ctx.strokeStyle=TH.map;ctx.strokeText(s.name,X+6,Y+9);
      ctx.fillStyle=TH.fg;ctx.fillText(s.name,X+6,Y+9);
    }
  }
  ctx.font='600 11px Inter,system-ui,sans-serif';
  const seen=new Set();
  for(const r of ROUTES){
    for(const [name,pt] of [[r.from,r.xy[0]],[r.to,r.xy[r.xy.length-1]]]){
      if(seen.has(name)||(r.partial&&name===r.to))continue;seen.add(name);
      const [X,Y]=P(pt[0],pt[1]);
      ctx.fillStyle=TH.surface;ctx.strokeStyle=TH.fg;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(X,Y,5,0,7);ctx.fill();ctx.stroke();
      const tw=ctx.measureText(name).width;
      const lx=X>W*0.6?X-tw-9:X+9;
      ctx.lineWidth=3;ctx.strokeStyle=TH.map;ctx.strokeText(name,lx,Y-10);
      ctx.fillStyle=TH.fg;ctx.fillText(name,lx,Y-10);
    }
  }
  if(DEPOT_K){
    const [X,Y]=P(DEPOT_K[0],DEPOT_K[1]);
    ctx.fillStyle=TH.accent;ctx.strokeStyle=TH.surface;ctx.lineWidth=2;
    ctx.beginPath();ctx.rect(X-7,Y-7,14,14);ctx.fill();ctx.stroke();
    ctx.font='700 11px Inter,system-ui,sans-serif';
    ctx.lineWidth=3;ctx.strokeStyle=TH.map;ctx.textAlign='right';ctx.strokeText('Депо',X-11,Y-4);ctx.fillStyle=TH.fg;ctx.fillText('Депо',X-11,Y-4);ctx.textAlign='left';
  }
  for(const v of S.vehicles){
    if(!isOut(v))continue;
    const r=RBY[v.route];
    const zero=v.status==='line'&&(v.phase==='zero'||v.phase==='back');
    let x,y,x2,y2;
    if(zero&&DEPOT_K){
      const s0=r.xy[0],pr=Math.max(0,Math.min(1,1-v.zeroLeft/(v.zeroTotal||1)));
      const a=v.phase==='zero'?DEPOT_K:s0,b=v.phase==='zero'?s0:DEPOT_K;
      x=a[0]+(b[0]-a[0])*pr;y=a[1]+(b[1]-a[1])*pr;x2=x+(b[0]-a[0])*.01;y2=y+(b[1]-a[1])*.01;
    }else{
      [x,y]=posAt(r,zero?0:v.d);
      [x2,y2]=posAt(r,Math.max(0,Math.min(r.len,(zero?0:v.d)+(zero?1:v.dir)*0.08)));
    }
    const [X,Y]=P(x,y);const [X2,Y2]=P(x2,y2);
    const ang=(X2!==X||Y2!==Y)?Math.atan2(Y2-Y,X2-X):0;
    const bad=v.status!=='line';
    drawTrolley(X,Y,ang,bad?TH.bad:r.color,zero||v.status==='tow'?.55:1,v.model);
    let label=String(v.num);
    if(v.status==='broken'||v.status==='mechgo'||v.status==='fixing')label='! '+label;
    if(v.status==='tow')label='→ '+label;
    if(zero)label=label+(v.phase==='zero'?' · нулевой':' · в парк');
    ctx.font='700 11px "Space Grotesk",Inter,sans-serif';
    const tw=ctx.measureText(label).width;
    ctx.globalAlpha=zero?.8:1;
    ctx.fillStyle=TH.surface;ctx.strokeStyle=bad?TH.bad:r.color;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(X-tw/2-5,Y-29,tw+10,17,5);ctx.fill();ctx.stroke();
    ctx.fillStyle=TH.fg;ctx.textAlign='center';ctx.fillText(label,X,Y-20);ctx.textAlign='left';ctx.globalAlpha=1;
  }
  ctx.font='700 13px "Space Grotesk",Inter,sans-serif';ctx.textAlign='center';
  for(const f of floaters){
    const [X,Y]=P(f.x,f.y);ctx.globalAlpha=Math.max(0,1-f.t/1.6);
    ctx.lineWidth=3;ctx.strokeStyle=TH.map;ctx.strokeText(f.txt,X,Y-36-f.t*18);
    ctx.fillStyle=TH.good;ctx.fillText(f.txt,X,Y-36-f.t*18);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
  const km=view.s>90?1:view.s>35?2:5;const L=km*view.s;
  const bx=14,by=H-48;
  ctx.strokeStyle=TH.fg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by-4);ctx.lineTo(bx,by);ctx.lineTo(bx+L,by);ctx.lineTo(bx+L,by-4);ctx.stroke();
  ctx.font='600 11px Inter,system-ui,sans-serif';ctx.fillStyle=TH.fg;ctx.fillText(km+' км',bx+L+6,by-2);
}

/* ---------- главный цикл ---------- */
let last=performance.now(),uiT=0,saveT=0;
function frame(now){
  const dt=Math.min(0.25,(now-last)/1000);last=now;
  step(dt);draw();
  uiT+=dt;saveT+=dt;
  if(uiT>0.5){
    uiT=0;renderHeader();
    const ae=document.activeElement;
    if(!(ae&&ae.tagName==='SELECT')){
      if(tab==='fleet')renderFleet();
      if(tab==='routes'&&!document.querySelector('#resetbtn[data-sure]'))renderRoutes();
    }
    if(tab==='log')renderLog();
  }
  if(saveT>10){saveT=0;save();}
  requestAnimationFrame(frame);
}
resize();renderAll();requestAnimationFrame(frame);

</script>
